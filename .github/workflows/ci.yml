# Checks every push: the website (Rust, Paquets, WebAssembly) on Linux, the iOS app
# (Swift) on the Xcode 27 runner. When everything is green, the branch is merged into
# master automatically (except master itself and branches named wip/...), then master is
# deployed: GitHub Pages (pages.yml) and Heroku (heroku.yml, when configured). A push made
# by a workflow starts no other workflow, so the deployments are started explicitly.

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  # Paquets and its packages are private repositories: Cargo fetches them through git,
  # which asks GitHub's credentials to a helper reading the REPOS_TOKEN secret, a
  # GitHub token that can read them. The token stays out of every URL.
  REPOS_TOKEN: ${{ secrets.REPOS_TOKEN }}
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  GIT_CONFIG_COUNT: ${{ secrets.REPOS_TOKEN != '' && 1 || 0 }}
  GIT_CONFIG_KEY_0: credential.https://github.com.helper
  GIT_CONFIG_VALUE_0: '!f() { test "$1" = get && echo username=x-access-token && echo "password=$REPOS_TOKEN"; }; f'
  CARGO_TERM_COLOR: always

jobs:
  site:
    name: Site (fmt, clippy, tests, WebAssembly)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: site
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - name: Clippy (browser, wasm32)
        run: cargo clippy --lib --target wasm32-unknown-unknown -- -D warnings
      - run: cargo test
      - name: Browser bundle
        run: |
          cargo build --lib --target wasm32-unknown-unknown --profile wasm-release
          version=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p')
          cargo install wasm-bindgen-cli --version "$version" --locked --bin wasm-bindgen
          wasm-bindgen --target web --no-typescript --remove-name-section --remove-producers-section \
            --out-dir pkg target/wasm32-unknown-unknown/wasm-release/duova_site.wasm
          ls -l pkg
      - name: Static export (GitHub Pages)
        run: |
          BASE_PATH=/${{ github.event.repository.name }} cargo run --release -- export dist
          test -f dist/index.html && test -f dist/404.html && test -f dist/pkg/duova_site_bg.wasm

  ios:
    name: iOS (DuovaKit tests, app build)
    runs-on: xcode-27
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v7
      - run: xcodebuild -version && swift --version
      - name: DuovaKit tests
        run: swift test --package-path DuovaKit
      - name: App build (simulator)
        run: |
          xcodebuild build \
            -project Duova.xcodeproj \
            -scheme Duova \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

  merge:
    name: Merge into master
    needs: [site, ios]
    if: >-
      github.event_name == 'push' && github.ref_name != 'master' &&
      !startsWith(github.ref_name, 'wip/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    concurrency:
      group: merge-into-master
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0
      - name: Merge ${{ github.ref_name }}
        env:
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git merge-base --is-ancestor "$SHA" HEAD; then
            echo "$BRANCH is already in master."
            exit 0
          fi
          git merge --no-ff --no-edit "$SHA" -m "Merge branch '$BRANCH' into master (auto-merge)"
          git push origin HEAD:master
      - name: Deploy master
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run pages.yml --ref master --repo "$GITHUB_REPOSITORY"
          gh workflow run heroku.yml --ref master --repo "$GITHUB_REPOSITORY"
